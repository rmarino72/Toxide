name: Publish to NuGet

# Push a tag like v0.1.0 (matching <Version> in Toxide.csproj) to publish.
# Authentication uses nuget.org Trusted Publishing (OIDC): no API key is stored anywhere.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets the job request a short-lived nuget.org token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Check that the tag matches the package version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Toxide/Toxide.csproj)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - run: dotnet test -c Release
      - run: dotnet pack Toxide/Toxide.csproj -c Release -o artifacts

      - name: Get a temporary nuget.org key (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: RosarioMarino

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
